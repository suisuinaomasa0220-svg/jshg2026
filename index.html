<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JSHG2026 時間割</title>
<!-- 入口ページ（GitHub Pages）。ホーム画面アイコンから開く用。中身は Apps Script の時間割をそのまま表示する。
     ?k=… （すいすい用 / AT用 のキー）はそのまま時間割へ渡す。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-192.png">
<meta name="theme-color" content="#b85c7a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#faf7f8;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<script>
(function(){
  var APP='https://script.google.com/macros/s/AKfycbwS_HuiKN-y25P81uKLdWjEeP3CFv1B8QJNATG3HKU46UmUjSVF4OBVTarwGhiwZajQ/exec';
  // インストール（ホーム画面追加）後は start_url で開かれ ?k= が落ちるので、最後に使ったキーをこの端末に覚えておく
  var q=location.search||'';
  var m=/[?&]k=([^&]+)/.exec(q);
  try{
    if(m){localStorage.setItem('jshg2026k',m[1]);}
    else{var k=localStorage.getItem('jshg2026k');if(k){q='?k='+k;}}
  }catch(e){}
  var f=document.createElement('iframe');
  f.src=APP+q+location.hash;
  f.setAttribute('allow','clipboard-write');
  f.title='JSHG2026 時間割';
  document.body.appendChild(f);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
</body>
</html>
