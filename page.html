#minib.vseg{border-color:var(--accent);gap:0}
#minib.vseg button{color:color-mix(in srgb,var(--muted) 70%,transparent);font-weight:700;padding:4px 7px}
#minib.vseg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:900}
body.mini .slot:has(.pick[aria-pressed=true]) .sess{justify-content:flex-start;align-items:stretch;padding:3px 2px 3px 9px}
body.mini .slot:has(.pick[aria-pressed=true]) .sess .meta{justify-content:flex-start}
body.mini .slot:has(.pick[aria-pressed=true]) .sess .sname{display:block!important;font-size:.56rem;line-height:1.22;font-weight:800;white-space:normal!important;overflow:hidden;text-overflow:clip;text-wrap:wrap;margin-top:1px;word-break:break-all}
body.mini .slot:not(:has(.pick[aria-pressed=true])) .sess{opacity:.55}
@media (min-width:900px){
  body.mini .slot:has(.pick[aria-pressed=true]) .sess .sname{font-size:.7rem;word-break:normal}
}
.hbar>div{height:1px}
.hbar[hidden]{display:none}
.hbar::-webkit-scrollbar{height:12px}
.hbar::-webkit-scrollbar-track{background:var(--line);border-radius:999px}
.hbar::-webkit-scrollbar-thumb{background:var(--accent);border-radius:999px;border:2px solid var(--line)}
.hbar{position:fixed;left:0;right:0;bottom:0;z-index:24;height:16px;overflow-x:auto;overflow-y:hidden;background:color-mix(in srgb,var(--bg) 85%,transparent);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);scrollbar-color:var(--accent) var(--line)}
@media (hover:hover) and (pointer:fine){
  body.hasbar .rtog{bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  body.hasbar .nowbtn{bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  .scroll::-webkit-scrollbar{display:none}
}
@media not ((hover:hover) and (pointer:fine)){
  .hbar{display:none!important}
}
.ttb{position:relative;display:grid;grid-template-columns:24px repeat(var(--nr,4),minmax(0,1fr));gap:6px;margin-top:12px}
body.mini .tt{min-width:0}
body.mini .tth,body.mini .ttb{grid-template-columns:18px repeat(var(--nr,4),minmax(0,1fr));gap:2px}
body.mini .rh{justify-content:center}
body.mini .rh small{display:none}
body.mini .rh .rn{font-size:0;padding:1px 0;width:100%;text-align:center}
body.mini .rh .rn::after{content:attr(data-s);font-size:.72rem}
body.mini .slot{gap:0}
body.mini .slot .who2{display:none}
body.mini .slot .sess{padding:2px 1px;border-radius:6px;border-width:0;justify-content:center;align-items:center}
body.mini .slot .sess::after{display:none}
body.mini .sess .meta{margin:0;justify-content:center}
body.mini .sess .meta>*:not(.code){display:none}
body.mini .sess .code{font-size:.56rem;padding:0 1px;background:none}
body.mini .sess .sname,body.mini .sess .cspk,body.mini .sess .cchair{display:none}
body.mini .slot:has(.pick.a[aria-pressed=true]) .sess{box-shadow:inset 4px 0 0 var(--pa)}
body.mini .slot:has(.pick.b[aria-pressed=true]) .sess{box-shadow:inset -4px 0 0 var(--pb)}
body.mini .slot:has(.pick.a[aria-pressed=true]):has(.pick.b[aria-pressed=true]) .sess{box-shadow:inset 4px 0 0 var(--pa),inset -4px 0 0 var(--pb)}
body.mini .slot.both .sess{animation:none;border:0;background:var(--kbg)}
body.mini .tick{font-size:.6rem}
body.mini .route-svg .rl{stroke-width:2.5}
body.mini .route-svg .rg{stroke-width:6}
.sess[data-kind="ora"],#sbody[data-kind="ora"]{--kc:var(--ora);--kbg:var(--ora-bg)}
.sess[data-kind="lun"],#sbody[data-kind="lun"]{--kc:var(--lun);--kbg:var(--lun-bg)}
.sess[data-kind="pos"],#sbody[data-kind="pos"]{--kc:var(--pos);--kbg:var(--pos-bg)}
.sess[data-kind="awd"],#sbody[data-kind="awd"]{--kc:var(--awd);--kbg:var(--awd-bg)}
.sess[data-kind="oth"],#sbody[data-kind="oth"]{--kc:var(--oth);--kbg:var(--oth-bg)}
.tth .rh{flex-wrap:nowrap;white-space:nowrap;align-items:center;min-width:0;overflow:hidden}
.tth .rh small{display:inline;width:auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tth .rh .rn{flex:none}
.rtog button.a[aria-pressed=true]{background:var(--pa);border-color:var(--pa);color:#fff}
.rtog button.b[aria-pressed=true]{background:var(--pb);border-color:var(--pb);color:#fff}
body.pmode .rtog{display:none}
.route-svg{position:absolute;left:0;top:0;z-index:3;pointer-events:none;overflow:visible}
.route-svg .rl{fill:none;stroke-width:3.5;stroke-linecap:round;opacity:.9}
.route-svg .rg{fill:none;stroke-width:10;opacity:.22;stroke-linecap:round}
.route-svg .dash{stroke-dasharray:7 6}
.route-svg .rs{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:3 97;filter:drop-shadow(0 0 4px #fff);animation:rflow 2.6s linear infinite}
@keyframes rflow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .route-svg .rs{display:none}
}
.hband{position:absolute;left:0;right:0;z-index:3;pointer-events:none;border-radius:12px;background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:inset 0 0 0 3px var(--accent),0 0 22px 6px color-mix(in srgb,var(--accent) 45%,transparent);animation:hblink .45s ease-in-out 6 alternate;transition:opacity .5s}
.hband.out{opacity:0}
@keyframes hblink{from{opacity:.2}to{opacity:1}}
.tick.hit{color:#fff!important;background:var(--accent);border-radius:999px;left:2px;right:2px;animation:hblink .45s ease-in-out 6 alternate}
@media (prefers-reduced-motion:reduce){
  .hband,.tick.hit{animation:none}
}
.ttb>.axis,.tth>div:first-child{position:sticky;left:0;z-index:4;background:var(--axis);border-radius:8px}
.ttb>.axis{box-shadow:3px 0 6px -4px rgba(30,35,90,.35);border-radius:0 0 8px 8px}
.tth>div:first-child{border-radius:8px 8px 0 0;margin-bottom:-4px;box-shadow:3px 0 6px -4px rgba(30,35,90,.35)}
.tick{position:absolute;transform:translateY(-.6em);font-family:var(--mono);font-size:.72rem;font-weight:700;left:0;right:0;text-align:center;color:var(--axis-fg)}

.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px;padding-bottom:84px;position:relative;z-index:1}
.roletag{margin-left:auto;font-size:.68rem;font-weight:800;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 8px;white-space:nowrap}
h1 .roletag+.swlink{margin-left:6px!important}
#pv .wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 60px}
#pv h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0 0 4px;text-wrap:balance}
#pv h1 .y{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:0 .4em;margin-right:.3em;transform:rotate(-3deg)}
#pv .hd{display:flex;align-items:center;gap:6px;margin:0}
#pv .frow{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;align-items:center}
#pv .fl{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
#pv .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
#pv input,#pv textarea{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
#pv input[type=search]{flex:1 1 160px;min-width:0;font-size:.9rem}
#pv input:focus-visible,#pv textarea:focus-visible,#pv button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pv .count{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
#pv .tabs{display:flex;gap:5px}
#pv .tabs .tab{flex:1 1 auto;padding-inline:6px}
#pv .tabs .tab[data-tier="a"][aria-pressed=true]{background:var(--pa);border-color:var(--pa)}
#pv .tabs .tab[data-tier="b"][aria-pressed=true]{background:var(--pb);border-color:var(--pb)}
@media (max-width:380px){
  #pv .tabs .tab{font-size:.7rem;padding-inline:4px}
}
#pv .pdays .tab[aria-pressed=true]{background:var(--dc,var(--accent));border-color:var(--dc,var(--accent))}
#pv .pdays .tab{border-color:var(--dc,var(--line))}
#pv .dchip{font-weight:800;color:#fff;background:var(--dc);border-radius:999px;padding:0 7px;white-space:nowrap}
#pv .tabdesc{margin:0;font-size:.74rem;color:var(--muted);line-height:1.4}
#pv .copybar{display:flex;flex-direction:column;gap:6px;margin-top:14px}
#pv .copybtn{font:inherit;font-weight:800;font-size:.86rem;border:0;border-radius:999px;padding:9px 14px;background:var(--fg);color:var(--bg);cursor:pointer}
#pv .copybar textarea{font-family:var(--mono);font-size:.74rem;min-height:9em;width:100%;box-sizing:border-box}
#pv .tab{font:inherit;font-weight:700;font-size:.8rem;padding:5px 4px;border:2px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);cursor:pointer;text-align:center;white-space:nowrap}
#pv .tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
#pv .chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
#pv .chips::-webkit-scrollbar{display:none}
#pv .chipwrap{position:relative;min-width:0}
#pv .chipwrap::before,#pv .chipwrap::after{content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;opacity:0;transition:opacity .2s}
#pv .chipwrap::before{left:0;background:linear-gradient(to right,var(--bg) 35%,transparent)}
#pv .chipwrap::after{right:0;background:linear-gradient(to left,var(--bg) 35%,transparent)}
#pv .chipwrap.ml::before,#pv .chipwrap.mr::after{opacity:1}
#pv .sarr{position:absolute;top:50%;transform:translateY(-50%);z-index:1;width:22px;height:22px;border-radius:50%;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:.9rem;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0 0 2px}
#pv .sarr.l{left:0}
#pv .sarr.r{right:0}
#pv .chipwrap.ml .sarr.l,#pv .chipwrap.mr .sarr.r{display:flex}
@keyframes nudge{50%{transform:translate(3px,-50%)}}
#pv .chipwrap.mr .sarr.r{animation:nudge 1.2s ease-in-out 3}
@media (prefers-reduced-motion:reduce){
  #pv .chipwrap.mr .sarr.r{animation:none}
}
#pv .chip{font:inherit;font-size:.74rem;font-weight:500;white-space:nowrap;padding:3px 10px;border:0;border-radius:999px;background:var(--chip);color:var(--fg);cursor:pointer}
#pv .chip[aria-pressed=true]{background:var(--fg);color:var(--bg)}
#pv .tier{margin-top:18px}
#pv .tier h2{display:inline-flex;gap:.5em;align-items:baseline;font-family:var(--display);font-size:1.02rem;color:#fff;background:var(--tc);padding:3px 14px;border-radius:999px;margin:0 0 4px}
#pv .tier h2 small{font-family:var(--font);font-size:.72rem;opacity:.9}
#pv .tier .why{font-size:.74rem;color:var(--muted);margin:0 0 8px}
#pv .tier.must{--tc:var(--must);--tbg:var(--must-bg)}
#pv .tier.hot{--tc:var(--hot);--tbg:var(--hot-bg)}
#pv .tier.oth{--tc:var(--oth);--tbg:var(--oth-bg)}
#pv .list{display:flex;flex-direction:column;gap:8px}
#pv .card:hover{border-color:var(--tc)}
#pv .cbody{all:unset;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
#pv .code{font-family:var(--mono);font-weight:500;background:var(--tbg);color:var(--tc);padding:0 6px;border-radius:5px}
#pv .theme{color:var(--muted)}
#pv .flag.pharma{background:var(--pharma-bg);color:var(--pharma)}
#pv .flag.corp{background:var(--chip);color:var(--muted)}
#pv .flag.kw,#pv .flag.gwas{background:var(--gwas-bg);color:var(--gwas)}
#pv .flag.okada{background:var(--okada-bg);color:var(--okada)}
#pv .foot{display:grid;grid-template-columns:1fr 1fr auto;gap:5px;align-items:center}
#pv .skip{font:inherit;font-size:.7rem;font-weight:700;border:0;background:none;color:var(--muted);cursor:pointer;padding:5px 4px;white-space:nowrap}
#pv .grp{background:var(--panel);border-radius:14px;margin-bottom:6px}
#pv .grp summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;padding:9px 12px;font-weight:700;font-size:.88rem}
#pv .grp summary::-webkit-details-marker{display:none}
#pv .grp summary::before{content:"＋";color:var(--tc);margin-right:8px}
#pv .grp[open] summary::before{content:"－"}
#pv .grp summary span{margin-left:auto;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
#pv .grp .list{padding:0 6px 8px}
#pv .more{display:block;width:100%;margin-top:16px;font:inherit;font-weight:800;font-size:.88rem;border:2px dashed var(--oth);color:var(--oth);background:var(--oth-bg);border-radius:14px;padding:12px;cursor:pointer}
#pv .pick{font:inherit;font-size:.74rem;font-weight:700;padding:5px 4px;border:2px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);cursor:pointer;text-align:center}
#pv .pick.arm{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#pv .memo-n{font:inherit;font-size:.72rem;font-weight:700;border:0;background:var(--chip);color:var(--fg);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
#pv .goers{font-size:.72rem;color:var(--muted);line-height:1.4}
#pv .goers b{color:var(--fg);font-weight:700}
#pv mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
#pv .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:.85rem}
#pv .sheet{position:fixed;inset:0;z-index:30;background:rgba(20,22,50,.4);display:flex;align-items:flex-start;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
#pv .sheetin{width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column;gap:6px;animation:pnyu .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pnyu{from{transform:translateY(24px) scale(.92);opacity:0}to{transform:none;opacity:1}}
#pv .sclose{align-self:flex-end;font:inherit;font-weight:700;font-size:.82rem;border:2px solid var(--tc,var(--accent));border-radius:999px;padding:5px 14px;background:var(--panel);color:var(--fg);cursor:pointer}
#pv .panel{background:var(--panel);border:3px solid var(--tc,var(--accent));border-radius:16px;padding:14px 15px;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
#pv .panel .ttl{font-size:1.04rem}
#pv .panel .ja{font-size:.95rem}
#pv .sec{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
#pv .why2{background:var(--tbg,var(--chip));border-radius:10px;padding:6px 10px;font-size:.82rem}
#pv .abs{font-size:.92rem;line-height:1.65}
#pv .au{font-size:.84rem}
#pv .memos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#pv .memo{background:var(--chip);border-radius:12px;padding:7px 10px;font-size:.88rem}
#pv .memo .nm{font-weight:800;margin-right:6px}
#pv .memo .tm{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-left:6px}
#pv .memo .del{font:inherit;font-size:.7rem;border:0;background:none;color:var(--accent);cursor:pointer;padding:0 0 0 6px}
#pv .mform{display:grid;grid-template-columns:7em minmax(0,1fr);gap:6px}
#pv .mform textarea{grid-column:1/-1;min-height:3.2em;resize:vertical}
#pv .mform button{grid-column:1/-1;font:inherit;font-weight:800;border:0;border-radius:999px;padding:8px;background:var(--accent);color:#fff;cursor:pointer}
#pv .hint{font-size:.72rem;color:var(--muted)}
#pv .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--fg);color:var(--bg);font-size:.8rem;font-weight:700;padding:8px 14px;border-radius:999px}
@keyframes ppop{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-5deg)}60%{transform:scale(.92)}100%{transform:scale(1)}}
#pv .pick.pop{animation:ppop .5s cubic-bezier(.3,1.6,.5,1)}
@media (max-width:520px){
  #pv h1{font-size:1.12rem}
  #pv .tab{font-size:.74rem}
  #pv .ttl{font-size:.86rem}
}
@media (prefers-reduced-motion:reduce){
  #pv *{animation:none!important;transition:none!important}
}
body.pmode>.wrap{display:none!important}
body.pmode::after{display:none!important}
.tth{display:grid;grid-template-columns:24px repeat(var(--nr,4),minmax(0,1fr));gap:6px;margin-bottom:4px;position:relative;z-index:5;will-change:transform;background:color-mix(in srgb,var(--accent) 14%,var(--bg));border-radius:12px;padding:6px 6px 4px}
.tth.stuck{box-shadow:0 6px 10px -8px rgba(30,35,90,.4);padding-block:4px 2px;background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.rtog{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;background:var(--panel);border-radius:999px;box-shadow:0 6px 16px -6px rgba(30,35,90,.45);gap:6px;padding:5px 6px 5px 12px}
.rtog .rl0{font-weight:800;color:var(--muted);margin-right:2px;font-size:.8rem}
#tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center}
.drow{display:flex;gap:6px;min-height:50px;align-items:center}
.drow #tabs,.drow .vseg{height:46px;align-items:center}
#tabs .tab::after{content:attr(data-s);font-size:.78rem;transition:font-size .32s cubic-bezier(.34,1.56,.64,1)}
#tabs .tab[aria-pressed=true]::after{font-size:1.18rem}
.vseg{display:flex;border-radius:999px;align-items:center;border:0;background:none;gap:4px;overflow:visible;flex:none;width:124px;min-width:124px}

function dayOf(p,i){const m=String(p.code).match(/^P([123])-/);return m?m[1]:String(i%3+1)}
function classify(p,i){
  const txt=[p.title,p.ja,p.abs].join(" ");
  const pharma=RE_PHARMA.test(p.affil);
  const tags=TAGS.filter(t=>t.re.test(t.field==="affil"?p.affil:t.field==="authors"?p.authors:txt));
  const f={pharma,corp:!pharma&&RE_COMPANY.test(p.affil),profs:tags.filter(t=>t.key==="prof"),kw:tags.filter(t=>!t.field),hits:tags};
  const tier=f.hits.length?"hot":"oth";
  const first=tags[0];
  return {...p,f,tags:tags.map(t=>t.label),theme:first?first.label:"その他",tier,day:dayOf(p,i)};
}
const DATA=POSTERS.map((p,i)=>classify(p,i)).sort((a,b)=>b.f.hits.length-a.f.hits.length);

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(s){const t=S.q.trim();if(!t)return esc(s);let out=esc(s);t.split(/\s+/).forEach(w=>{if(!w)return;const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");out=out.replace(re,"<mark>$1</mark>")});return out}
function flags(p){return p.tags.map(k=>`<span class="flag kw">${esc(k)}</span>`).join("")}
function goers(code){
  const m=S.marks[code]||{};const go=[];if(m.a)go.push("すいすい");if(m.b)go.push("AT");
  const rq=[];(S.memos[code]||[]).forEach(x=>{if(!rq.includes(x.name))rq.push(x.name)});
  const parts=[];if(go.length)parts.push('見に行く：<b>'+go.join("・")+'</b>');if(rq.length)parts.push('リクエスト：<b>'+rq.map(esc).join("、")+'</b>');
  return parts.length?'<div class="goers">'+parts.join("　")+'</div>':'';
}
function auShort(s){const a=String(s||'').split(/\s*[,、，;；]\s*/).map(x=>x.trim()).filter(Boolean);if(!a.length)return '';if(a.length===1)return hl(a[0]);if(a.length===2)return hl(a[0])+'、'+hl(a[1]);return hl(a[0])+' … '+hl(a[a.length-1])+'<span class="aun">（'+a.length+'名）</span>'}
function why(p){const L=p.tags||[];if(!L.length)return '';return L.slice(0,3).join('・')+(L.length>3?' +'+(L.length-3):'')}
function card(p){
  const m=S.marks[p.code]||{};const n=(S.memos[p.code]||[]).length;
  return `<article class="card t-${p.tier}" data-code="${p.code}">
    <button class="cbody" type="button" data-open="${p.code}">
      <div class="meta"><span class="code">${p.code}</span><span class="when">${PDAYS[p.day-1].short} ${(PDAYS[p.day-1].disc||'').split('–')[0]}</span><span class="why t-${p.tier}">${why(p)}</span></div>
      <div class="ja">${hl(p.ja)}</div><div class="ttl">${hl(p.title)}</div>
      <div class="au1">${auShort(p.authors)}</div>
      <div class="aff">${hl(p.affil)}</div>
    </button>
    ${goers(p.code)}
    <div class="foot">
      <button type="button" class="pick a" data-pick="a" aria-pressed="${!!m.a}">すい</button>
      <button type="button" class="pick b" data-pick="b" aria-pressed="${!!m.b}">AT</button>
      <button type="button" class="memo-n${n?' has':''}" data-open="${p.code}">メモ ${n}</button>
    </div></article>`;
}
function matches(p){
  if(S.day&&p.day!==S.day)return false;
  if(S.tier==="rec"&&p.tier==="oth")return false;
  if(S.tier==="a"&&!(S.marks[p.code]||{}).a)return false;
  if(S.tier==="b"&&!(S.marks[p.code]||{}).b)return false;
  if(S.tier==="memo"&&!(S.memos[p.code]||[]).length)return false;
  if(S.theme&&(S.theme==="その他"?p.theme!=="その他":!p.tags.includes(S.theme)))return false;
  const t=S.q.trim().toLowerCase();if(!t)return true;
  const hay=[p.code,p.title,p.ja,p.affil,p.authors,p.abs,p.theme].join(" ").toLowerCase();
  return t.split(/\s+/).every(w=>hay.includes(w));
}
function render(){
  if(!["rec","a","b","memo","all"].includes(S.tier))S.tier="rec";
  const nA=DATA.filter(p=>(S.marks[p.code]||{}).a).length,nB=DATA.filter(p=>(S.marks[p.code]||{}).b).length,nMemo=DATA.filter(p=>(S.memos[p.code]||[]).length).length;
  const tabs=[["rec","タグ"],["a","すい"],["b","AT"],["memo","メモ"],["all","全部"]];
  const DESC={rec:"キーワードタグに当たる演題。当たった数が多い順（定義は下の「タグの定義」）",a:`すいすいが印を付けた演題（${nA}件）`,b:`ATが印を付けた演題（${nB}件）`,memo:`メモ・リクエストが付いた演題（${nMemo}件）`,all:`全${DATA.length}演題。条件に合わないものはテーマ別にたたんであります`};
  $("ptabdesc").textContent=DESC[S.tier]||"";
  if(!$("pkwlist").childElementCount)$("pkwlist").innerHTML=TAGS.map(t=>`<li><b>${esc(t.label)}</b>：${esc(t.desc)}</li>`).join("");

  $("ptiers").innerHTML=tabs.map(([k,v])=>`<button type="button" class="tab" data-tier="${k}" aria-pressed="${S.tier===k}">${v}</button>`).join("");
  const ths=["",...TAGS.map(t=>t.label),"その他"];
  $("pthemes").innerHTML=ths.map(t=>{const c=DATA.filter(p=>t==="その他"?p.theme==="その他":p.tags.includes(t)).length;if(t&&!c)return"";return `<button type="button" class="chip" data-theme="${esc(t)}" aria-pressed="${S.theme===t}">${t?esc(t)+" "+c:"全テーマ"}</button>`}).join("");
  const rows=DATA.filter(matches);

    }
    return `<section class="tier ${k}">${head}<div class="list">${rs.map(card).join("")}</div></section>`}).join("");
  if(S.tier==="rec"&&oth)html+=`<button type="button" class="more" data-tier="all">残り ${oth} 件をテーマ別に見る</button>`;
  if(S.tier==="memo")html=`<div class="copybar"><button type="button" class="copybtn" id="copymemo">メモ付き演題をテキストでコピー</button><textarea id="pcopyout" readonly hidden aria-label="コピー用テキスト"></textarea></div>`+html;

/* ---------- sheet ---------- */
let openCode=null;
function sheet(code){
  const p=DATA.find(x=>x.code===code);if(!p)return;openCode=code;
  const why=[p.tags.length&&("タグ："+p.tags.join("・"))].filter(Boolean);
  const ms=S.memos[code]||[];
  const tc={must:"var(--must)",hot:"var(--hot)",oth:"var(--oth)"}[p.tier],tb={must:"var(--must-bg)",hot:"var(--hot-bg)",oth:"var(--oth-bg)"}[p.tier];
  $("psheetin").style.setProperty("--tc",tc);$("psheetin").style.setProperty("--tbg",tb);
  $("psbody").innerHTML=`
    <div class="meta"><span class="code">${p.code}</span><span class="dchip" style="--dc:var(--d${p.day})">${PDAYS[p.day-1].short} 討論${PDAYS[p.day-1].disc}</span>${flags(p)}<span class="theme">${esc(p.theme)}</span></div>
    <div><div class="ttl">${esc(p.title)}</div><div class="ja">${esc(p.ja)}</div></div>
    ${why.length?`<div class="why2"><b>${TIERS[p.tier].name}</b>：${why.join("・")}</div>`:""}
    <div><div class="sec">著者・所属</div><div class="au">${esc(p.authors)}<br><span class="theme">${esc(p.affil)}</span></div></div>
    <div><div class="sec">抄録</div><div class="abs">${esc(p.abs)}</div></div>
    <div><div class="sec">メモ・リクエスト</div>
      ${ms.length?`<ul class="memos">${ms.map(x=>`<li class="memo"><span class="nm">${esc(x.name)}</span>${esc(x.text)}<span class="tm">${esc(x.at)}</span>${S.mine.includes(x.id)?`<button type="button" class="del" data-del="${x.id}">取り消す</button>`:""}</li>`).join("")}</ul>`:'<p class="hint">まだ誰も書いていません。</p>'}
    </div>
    <form class="mform" id="mform">
      <input id="mname" placeholder="名前" required maxlength="20" aria-label="名前">
      <input id="mtext" placeholder="例：解析手法を詳しく聞いてきてほしい" maxlength="80" aria-label="メモ">
      <button type="submit">メモを残す</button>
    </form>
    <p class="hint">書き込みは追記のみ。取り消せるのは自分が書いたメモだけです。</p>`;
  try{$("mname").value=localStorage.getItem(LS+"-name")||""}catch(e){}
  $("psheet").hidden=false;
}
function closeSheet(){$("psheet").hidden=true;openCode=null}

/* ---------- events ---------- */
let armed=null,armT=0,downY=0;
document.addEventListener("pointerdown",e=>{downY=e.clientY});
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t||!t.closest("#pv"))return;
  if(t.dataset.pday!==undefined){S.day=t.dataset.pday;save();render();return}
  if(t.dataset.tier){S.tier=t.dataset.tier;save();render();return}
  if(t.dataset.theme!==undefined){S.theme=S.theme===t.dataset.theme?"":t.dataset.theme;save();render();return}
  if(t.dataset.open){sheet(t.dataset.open);return}
  if(t.dataset.pick){
    if(Math.abs(e.clientY-downY)>8)return;
    if(window.__pvCan&&!window.__pvCan(t.dataset.pick)){toast("このリンクでは"+(t.dataset.pick==="a"?"すいすい":"AT")+"の印は付けられません");return}
    const code=t.closest(".card").dataset.code,k=t.dataset.pick,m=S.marks[code]||(S.marks[code]={});
    if(m[k]){ if(armed!==t){armed&&armed.classList.remove("arm");armed=t;t.classList.add("arm");clearTimeout(armT);armT=setTimeout(()=>{t.classList.remove("arm");armed=null},2500);toast("もう一度タップで外します");return}
      armed=null;m[k]=false;}
    else{m[k]=true;}
    window.__pvMark&&window.__pvMark(code,k,!!m[k]);
    save();render();
    const nb=document.querySelector(`.card[data-code="${code}"] .pick.${k}`);if(nb&&m[k])nb.classList.add("pop");

  }
  if(t.dataset.del){const id=t.dataset.del;S.memos[openCode]=(S.memos[openCode]||[]).filter(x=>x.id!==id);S.mine=S.mine.filter(x=>x!==id);window.__pvMemoDel&&window.__pvMemoDel(id);save();render();sheet(openCode);return}
  if(t.id==="psclose")closeSheet();
  if(t.id==="copymemo"){
    const txt=DATA.filter(p=>(S.memos[p.code]||[]).length).map(p=>`【${p.code}】${p.title}\n（${p.ja}）\n`+(S.memos[p.code]).map(x=>`・${x.name}：${x.text}（${x.at}）`).join("\n")).join("\n\n");
    const ta=$("pcopyout");ta.value=txt;
    const fb=()=>{ta.hidden=false;ta.focus();ta.select();toast("コピーできなかったので、下の文を選択してコピーしてください")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("コピーしました"),fb)}catch(err){fb()}
  }
});
$("psheet").addEventListener("click",e=>{if(e.target.id==="psheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("psheet").hidden)closeSheet()});
document.addEventListener("submit",e=>{

});
$("pq").value=S.q||"";
$("pq").addEventListener("input",e=>{S.q=e.target.value;save();render()});
let tt;function toast(s){const el=$("ptoast");el.textContent=s;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800)}

/* sample memos so the shared view is visible at first open */

<script>
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  let el=null,sx=0,sl=0,drag=false,moved=false;
  document.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.pointerType!=='mouse')return;
    const s=e.target.closest&&e.target.closest('.scroll');if(!s)return;
    if(e.target.closest('input,textarea,select,a'))return;
    el=s;sx=e.clientX;sl=s.scrollLeft;drag=true;moved=false;
  },{capture:true});
  document.addEventListener('pointermove',e=>{
    if(!drag||!el)return;const dx=e.clientX-sx;
    if(!moved&&Math.abs(dx)<6)return;
    if(!moved){moved=true;el.classList.add('dragging')}
    el.scrollLeft=sl-dx;
  },{capture:true,passive:true});
  const end=()=>{if(!drag)return;drag=false;if(el)el.classList.remove('dragging');if(moved){const stop=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener('click',stop,{capture:true,once:true});setTimeout(()=>document.removeEventListener('click',stop,{capture:true}),300)}el=null};
  document.addEventListener('pointerup',end,{capture:true});document.addEventListener('pointercancel',end,{capture:true});
  document.addEventListener('keydown',e=>{
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
    const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
    const list=[...document.querySelectorAll('.scroll')].filter(s=>s.offsetParent!==null);
    const vh=innerHeight;const s=list.find(x=>{const r=x.getBoundingClientRect();return r.bottom>0&&r.top<vh})||list[0];if(!s)return;
    s.scrollBy({left:e.key==='ArrowRight'?260:-260,behavior:'smooth'});e.preventDefault();
  });
})();
</script>

<script>
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  const MIN=70,MAX=320,MINI_AT=120;let cw=180;
  let stored=false;try{const v=parseInt(localStorage.getItem('jshg2026cw')||'');if(v>=MIN&&v<=MAX){cw=v;stored=true}}catch(e){}
  const fit=()=>{const s=document.querySelector('.scroll');const tt=s&&s.querySelector('.tt');const nr=tt?parseInt(getComputedStyle(tt).getPropertyValue('--nr'))||4:4;const w=(s?s.clientWidth:innerWidth)-24;return Math.max(MIN,Math.min(MAX,Math.floor(w/nr)))};
  const tip=document.createElement('div');tip.className='zoomtip';document.body.appendChild(tip);let tt=0;
  const showTip=()=>{tip.textContent='列幅 '+cw+'px（Ctrl＋ホイールで調整／Ctrl＋0で画面幅に合わせる）';tip.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>tip.classList.remove('on'),1200)};
  const setMini=on=>{if(document.body.classList.contains('mini')===on)return;const b=document.querySelector('#minib button[data-m="'+(on?1:0)+'"]');if(b)b.click()};
  const apply=(s,x)=>{
    document.documentElement.style.setProperty('--cw',cw+'px');
    setMini(cw<MINI_AT);
    try{localStorage.setItem('jshg2026cw',String(cw))}catch(e){}
    showTip();
  };
  const zoom=(dir,s,x)=>{
    const old=cw;cw=Math.max(MIN,Math.min(MAX,Math.round(cw*(dir>0?1.12:1/1.12))));if(cw===old)return;
    const sl=s?s.scrollLeft:0;apply();
    if(s&&!document.body.classList.contains('mini')){const r=cw/old;s.scrollLeft=(sl+x)*r-x}
  };
  document.addEventListener('wheel',e=>{
    if(!e.ctrlKey)return;const s=e.target.closest&&e.target.closest('.scroll');if(!s)return;
    e.preventDefault();const x=e.clientX-s.getBoundingClientRect().left;zoom(e.deltaY<0?1:-1,s,x);
  },{passive:false,capture:true});
  document.addEventListener('keydown',e=>{
    if(!e.ctrlKey)return;const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
    const s=[...document.querySelectorAll('.scroll')].find(x=>x.offsetParent!==null);
    if(e.key==='+'||e.key==='='||e.key===';'){e.preventDefault();zoom(1,s,s?s.clientWidth/2:0)}
    else if(e.key==='-'){e.preventDefault();zoom(-1,s,s?s.clientWidth/2:0)}
    else if(e.key==='0'){e.preventDefault();cw=fit();apply()}
  });
  document.documentElement.style.setProperty('--cw',cw+'px');
  const init=()=>{if(!stored){const v=fit();if(v!==cw){cw=v;document.documentElement.style.setProperty('--cw',cw+'px')}}setMini(cw<MINI_AT)};
  setTimeout(init,0);setTimeout(init,400);
})();
</script>
