.hbar{position:fixed;left:0;right:0;bottom:var(--bbar-h,0px);z-index:24;height:16px;overflow-x:auto;overflow-y:hidden;background:color-mix(in srgb,var(--bg) 85%,transparent);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-color:var(--accent) var(--line)}
@media (hover:hover) and (pointer:fine){
  .scroll::-webkit-scrollbar{display:none}
}
@media not ((hover:hover) and (pointer:fine)){
  .hbar{display:none!important}
}
.ttb{position:relative;display:grid;grid-template-columns:24px repeat(var(--nr,4),minmax(0,1fr));gap:6px;margin-top:12px}
body.mini .tt{min-width:0}
body.mini .tth,body.mini .ttb{grid-template-columns:18px repeat(var(--nr,4),minmax(0,1fr));gap:2px}
body.mini .rh{justify-content:center}
body.mini .rh small{display:none}
body.mini .rh .rn{font-size:0;padding:1px 0;width:100%;text-align:center}
body.mini .rh .rn::after{content:attr(data-s);font-size:.72rem}
body.mini .slot{gap:0}
body.mini .slot .who2{display:none}
body.mini .slot .sess{padding:2px 1px;border-radius:6px;border-width:0;justify-content:center;align-items:center}
body.mini .slot .sess::after{display:none}
body.mini .sess .meta{margin:0;justify-content:center}
body.mini .sess .meta>*:not(.code){display:none}
body.mini .sess .code{font-size:.62rem;padding:0 1px;background:none}
body.mini .sess .sname,body.mini .sess .cspk,body.mini .sess .cchair{display:none}
body.mini .slot:has(.pick.a[aria-pressed=true]) .sess{box-shadow:inset 4px 0 0 var(--pa)}
body.mini .slot:has(.pick.b[aria-pressed=true]) .sess{box-shadow:inset -4px 0 0 var(--pb)}
body.mini .slot:has(.pick.a[aria-pressed=true]):has(.pick.b[aria-pressed=true]) .sess{box-shadow:inset 4px 0 0 var(--pa),inset -4px 0 0 var(--pb)}
body.mini .slot.both .sess{animation:none;border:0;background:var(--kbg)}
body.mini .tick{font-size:.64rem}
body.mini .route-svg .rl{stroke-width:2.5}
body.mini .route-svg .rg{stroke-width:6}
.sess[data-kind="ora"],#sbody[data-kind="ora"]{--kc:var(--ora);--kbg:var(--ora-bg)}
.sess[data-kind="lun"],#sbody[data-kind="lun"]{--kc:var(--lun);--kbg:var(--lun-bg)}
.sess[data-kind="pos"],#sbody[data-kind="pos"]{--kc:var(--pos);--kbg:var(--pos-bg)}
.sess[data-kind="awd"],#sbody[data-kind="awd"]{--kc:var(--awd);--kbg:var(--awd-bg)}
.sess[data-kind="oth"],#sbody[data-kind="oth"]{--kc:var(--oth);--kbg:var(--oth-bg)}
.tth .rh{flex-wrap:nowrap;white-space:nowrap;align-items:center;min-width:0;overflow:hidden}
.tth .rh small{display:inline;width:auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tth .rh .rn{flex:none}
.rtog button.a[aria-pressed=true]{background:var(--pa);border-color:var(--pa);color:#fff}
.rtog button.b[aria-pressed=true]{background:var(--pb);border-color:var(--pb);color:#fff}
body.pmode .rtog{display:none}
.route-svg{position:absolute;left:0;top:0;z-index:3;pointer-events:none;overflow:visible}
.route-svg .rl{fill:none;stroke-width:3.5;stroke-linecap:round;opacity:.9}
.route-svg .rr{stroke-width:3;opacity:.95}
.route-svg rect.rg{stroke-width:12;opacity:.28}
.route-svg .rg{fill:none;stroke-width:10;opacity:.22;stroke-linecap:round}
.route-svg .dash{stroke-dasharray:7 6}
.route-svg .rs{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:3 97;filter:drop-shadow(0 0 4px #fff);display:none}
@media (prefers-reduced-motion:reduce){
  .route-svg .rs{display:none}
}
.hband{position:absolute;left:0;right:0;z-index:3;pointer-events:none;border-radius:12px;background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:inset 0 0 0 3px var(--accent),0 0 22px 6px color-mix(in srgb,var(--accent) 45%,transparent);animation:hblink .45s ease-in-out 6 alternate;transition:opacity .5s}
.hband.out{opacity:0}
@keyframes hblink{from{opacity:.2}to{opacity:1}}
.tick.hit{color:#fff!important;background:var(--accent);border-radius:999px;left:2px;right:2px;animation:hblink .45s ease-in-out 6 alternate}
@media (prefers-reduced-motion:reduce){
  .hband,.tick.hit{animation:none}
}
.ttb>.axis,.tth>div:first-child{position:sticky;left:0;z-index:4;background:var(--axis);border-radius:8px}
.ttb>.axis{box-shadow:3px 0 6px -4px rgba(30,35,90,.35);border-radius:0 0 8px 8px}
.tth>div:first-child{border-radius:8px 8px 0 0;margin-bottom:-4px;box-shadow:3px 0 6px -4px rgba(30,35,90,.35)}
.tick{position:absolute;transform:translateY(-.6em);font-family:var(--mono);font-size:.72rem;font-weight:700;left:0;right:0;text-align:center;color:var(--axis-fg)}

#mp .mlegend .mchip{width:100%;box-sizing:border-box;justify-content:flex-start;padding:5px 12px 5px 6px;min-height:34px;text-align:left}
#mp .mlegend .mchip small{margin-left:auto;padding-left:8px;white-space:nowrap}
/* ===== PC：縦の画面を時間割に回す（見出しを2段に圧縮） ===== */
@media (hover:hover) and (pointer:fine){
  #bar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-block:6px}
  #bar>h1{display:contents}
  #bar>h1 .y{order:0;width:32px;height:32px}
  #bar>.drow{order:1;flex:1 1 0;min-width:0;min-height:0}
  #bar>h1 .vnav{order:2;margin:0}
  #bar>.bbody{order:3;flex:1 1 100%;display:flex;flex-direction:row;gap:8px;align-items:center;min-width:0}
  #bar.closed>.bbody{display:none}
  #bbar{padding-block:3px}
  #bbar button{min-height:0;height:30px;padding-block:0;font-size:.85rem}
  #bbar .nowbtn{height:30px;padding:0 16px;font-size:.9rem}
  #bar .drow #tabs,#bar .drow .vseg{height:36px}
  #bar .drow #tabs .tab,#bar .drow .vseg button,#bar .drow .btog,
  #bar .drow #tabs .tab[aria-pressed=true],#bar .drow .vseg button[aria-pressed=true],#bar .drow .btog[aria-expanded=true]{min-height:34px;height:34px;font-size:.85rem}
  #bar .drow .btog[aria-expanded=false]{min-height:30px;height:30px}
  #bar .srow{flex:0 1 380px;min-width:220px}
  #bar .srow input[type=search]{height:32px;padding-block:0}
  #bar .srow #langs .tab{min-height:30px;height:30px;padding:0 10px}
  #bar .tagsec{flex:1 1 0;min-width:0}
  #bar #chips{display:flex;flex-wrap:wrap;gap:4px}
  #bar #chips .chip{width:auto;height:28px;padding:0 10px;flex:none}
  #bar #chips .chip.clr{grid-column:auto}
  /* ポスター：横幅いっぱい・カードを複数列に */
  #pv .wrap{max-width:none}
  #pv .bar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 10px}
  #pv .bar>h1{flex:none;margin:0}
  #pv .bar>#ppdays,#pv .bar>#ptiers{flex:1 1 360px;min-width:0}
  #pv .bar>.srow{flex:1 1 420px;min-width:0}
  #pv .bar>.ptchips,#pv .bar>.tabdesc,#pv .bar>.kwdef,#pv .bar>.pthemerow{flex:1 1 100%;min-width:0}
  #pv .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:8px;align-items:start}
  /* 分析：左に地図（画面の高さに合わせる）、右に凡例と詳細カード */
  #mp .wrap{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);column-gap:14px;align-items:start}

/* ==== 2択・まとめ操作を「それとわかる形」に ==== */
/* 詳細／全体：画面切替と同じつまみ型（薄い帯の中で、選んでいる方だけ色付き） */
#minib.vseg{background:var(--accent-soft)!important;border-radius:999px;padding:3px;gap:2px;box-sizing:border-box;width:auto;min-width:0;align-self:center}
#minib.vseg button,.drow #minib.vseg button,.drow #minib.vseg button[aria-pressed=true]{border:0!important;background:transparent;color:var(--accent);min-height:40px!important;height:40px!important;font-size:.88rem!important;font-weight:800;width:auto;min-width:56px;max-width:none;padding:0 12px;box-shadow:none;border-radius:999px}
#minib.vseg button[aria-pressed=true],.drow #minib.vseg button[aria-pressed=true]{background:var(--accent)!important;color:#fff;box-shadow:0 2px 6px -2px rgba(80,30,50,.45)}
@media (min-width:700px){#minib.vseg button,.drow #minib.vseg button,.drow #minib.vseg button[aria-pressed=true]{min-height:28px!important;height:28px!important;font-size:.84rem!important}}
/* EN／JP：両方選べるので、1つの帯にまとめ、選んでいる方に✓ */
#langs{background:var(--accent-soft);border-radius:999px;padding:3px;gap:2px!important;align-items:center}
#langs .tab,#bar .srow #langs .tab{border:0!important;background:transparent;color:var(--accent);box-shadow:none;border-radius:999px;font-weight:800;min-height:30px;height:30px;padding:0 10px}
#langs .tab[aria-pressed=true]{background:var(--accent);color:#fff;box-shadow:0 2px 6px -2px rgba(80,30,50,.45)}
#langs .tab::before{content:'✓ ';font-weight:900;visibility:hidden}
#langs .tab[aria-pressed=true]::before{visibility:visible}
#langs .tab{min-width:4.2em;text-align:center}
/* すべて選ぶ／すべて外す：タグとは別物の「操作ボタン」として、左右がくっついた1組に */
.chip.clr{background:var(--panel)!important;border:1.5px solid var(--accent)!important;color:var(--accent)!important;font-weight:800;border-style:solid!important}
.chip.clr:has(+ .chip.clr){border-radius:999px 0 0 999px!important;margin-right:-3px;border-right-width:.75px!important}
.chip.clr + .chip.clr{border-radius:0 999px 999px 0!important;margin-left:-3px;border-left-width:.75px!important}
.chip.clr:active{background:var(--accent-soft)!important}
@media (max-width:699px){#chips .chip.clr,#pv .ptchips .chip.clr,#mp .mtags .chip.clr{width:calc(100% + 3px)!important;box-sizing:border-box}#chips .chip.clr+.chip.clr,#pv .ptchips .chip.clr+.chip.clr,#mp .mtags .chip.clr+.chip.clr{margin-left:-3px;justify-self:end}#chips .chip.clr:has(+.chip.clr),#pv .ptchips .chip.clr:has(+.chip.clr),#mp .mtags .chip.clr:has(+.chip.clr){margin-right:0;justify-self:start}}

/* 単位認定のマーク（遺・カ・細・産）：丸囲みの小さな文字 */
.crd{display:inline-flex;gap:2px;margin-left:2px}
.crd i{font-style:normal;font-size:.62rem;font-weight:800;line-height:1;width:1.35em;height:1.35em;display:inline-flex;align-items:center;justify-content:center;border:1.2px solid currentColor;border-radius:50%;color:var(--muted)}
.crdl{font-size:.8rem;color:var(--muted);margin:2px 0 6px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

/* 5〜10分の式典など：1行だけの細い札にする（印ボタンなし） */
.slot.tiny{height:auto!important;min-height:26px;z-index:6;right:auto!important;width:max-content!important;max-width:min(330px,92vw)}
.slot.tiny .sess{padding:2px 8px!important;min-height:26px;display:flex;flex-direction:row;align-items:center;gap:6px;overflow:hidden;background:#fff!important;border:2px solid var(--accent)!important;border-radius:999px!important;box-shadow:0 2px 6px -3px rgba(80,30,50,.5)}
.slot.tiny .sess .meta{display:flex;margin:0;flex:none}
.slot.tiny .sess .meta>:not(.tr){display:none!important}
.slot.tiny .sess .meta .tr{color:var(--accent);font-weight:800}
.slot.tiny .sess *{font-size:.78rem!important;line-height:1.2!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.tiny .sess .sname{font-weight:800;color:var(--fg)}
body.mini .slot.tiny .sess{border-width:1.5px!important;padding:0 4px!important}

/* 文字サイズ：rem で作っている文字・余白がまとめて大きく／小さくなる */
html.fs-s{font-size:88%}
html.fs-l{font-size:116%}
/* 見出し・ボタン類は元の大きさのまま（拡大縮小を打ち消す）。大きくなるのは演題の文字と詳細だけ */
html.fs-l .bar,html.fs-l #bbar,html.fs-l #fsB,html.fs-l .who2{zoom:.8621}
html.fs-s .bar,html.fs-s #bbar,html.fs-s #fsB,html.fs-s .who2{zoom:1.1364}
.fsbtn{flex:none;height:30px;padding:0 10px;border-radius:999px;border:1.5px solid var(--accent);background:var(--panel);color:var(--accent);font:inherit;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:3px}

/* ダークモード：画面全体の明暗を反転し、色相を戻して色の意味（紫＝すいすい・緑＝AT・種別色）を保つ。写真・アイコンは元に戻す */

.dkbtn{width:34px;padding:0;justify-content:center;font-size:15px;margin-left:-2px}

body.pmode #dkB,body.mmode #dkB{display:inline-flex}

#mp .mly .mli,#mp .mly .mri{margin-right:3px}

<script>
(function(){

/* 注意：このブロックではスラッシュ2つの並びと正規表現リテラルを使わない（本番の前処理で壊れるため） */
/* 表示は2種類：似ている順（t-SNE）／全体傾向（PCA）。興味×注目度の区画表示は 2026-11-01 に削除（描画コードは残置、ボタンなし） */
const $=id=>document.getElementById(id);

const B=window.__BOOT__||{},ROLE=B.role||'';
const COLS=['#3f51b5','#ef6c00','#0097a7','#c2185b','#2e7d32','#6d4c41','#8e24aa','#b58900','#546e7a','#e53935','#1e88e5'];

const LS='jshg2026map';
let st={mode:'ts',layers:{t:true,p:true},hi:-1,sel:null,vb:[0,0,1000,1000],tags:[],tagOpen:false,panel:'k',rings:{a:true,b:true},tip:true,labels:1};
try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o){st.mode=o.mode||'ts';st.layers=Object.assign(st.layers,o.layers||{});st.tags=Array.isArray(o.tags)?o.tags:[];if(o.panel==='t')st.panel='t';if(o.rings)st.rings=Object.assign(st.rings,o.rings);if(o.tip===false)st.tip=false;if(o.labels===false||o.labels===0)st.labels=0;else if(o.labels===2)st.labels=2}}catch(e){}

const PAD=60,SPAN=1000-2*PAD;

/* ---- 演題ごとの情報・注目タグ・印 ---- */
function info(it){
  if(it.t==='t'){const L=window.__ttItems||[];const i=L.find(x=>x.code===it.c);if(!i)return null;
    return {ja:i.ja||'',en:i.title||'',where:(i.date||'')+' '+(i.time||'')+'　'+String(i.room||'').replace('（',' （'),sess:i.session||''}}

const tagCache=new Map();

  else{const p=(window.__pvData||[]).find(x=>x.code===it.c);const lab=new Map(TG().map(t=>[t.label,t.key]));ks=p?(p.tags||[]).map(l=>lab.get(l)).filter(Boolean):[]}
  if(TG().length)tagCache.set(it.c,ks);return ks}
const HOVER=(()=>{try{return matchMedia('(hover:hover) and (pointer:fine)').matches}catch(e){return false}})();
function marks(it){
  if(it.t==='t'){const pl=(window.__ttPlan&&window.__ttPlan())||{};return pl[it.c.split('-')[0]]||{}}
  const mk=(window.__pvMarks&&window.__pvMarks())||{};return mk[it.c]||{}}
const activeTags=()=>st.tags.length?st.tags:TG().map(t=>t.key);
const hitsOf=it=>{const a=activeTags();return tagKeys(it).filter(k=>a.includes(k))};
/* 興味スコア：注目タグの当たり数＋自分の印（1） */
const interest=it=>hitsOf(it).length+((ROLE&&marks(it)[ROLE])?1:0);
const QN={tr:'必ず行く',tl:'盲点：学会は注目・自分は低め',br:'穴場：自分は注目・学会では少数',bl:'優先度低め'};
const quad=it=>{const hiI=interest(it)>=1,hiA=it.att>=0.5;return hiA?(hiI?'tr':'tl'):(hiI?'br':'bl')};
const jit=(c,salt)=>{let h=salt*7919;for(let i=0;i<c.length;i++)h=(h*31+c.charCodeAt(i))%100003;const f=(h*0.6180339887)%1;return f*2-1};
function pos(it){
  if(st.mode==='pc')return [PAD+it.px*SPAN,PAD+(1-it.py)*SPAN];
  if(st.mode==='qd'){const s=Math.min(4,interest(it));const xs=[0.13,0.45,0.64,0.81,0.95][s];
    const x=xs+jit(it.c,1)*(s===0?0.11:0.075);const y=it.att+jit(it.c,2)*0.012;

  return [PAD+it.x*SPAN,PAD+(1-it.y)*SPAN]}
const vis=it=>st.layers[it.t];

function draw(){

  const z=1000/st.vb[2];const zs=Math.pow(z,-0.85);svg.style.setProperty('--zs',zs.toFixed(4));const r=9.5*zs;const tagOn=st.tags.length>0&&st.mode!=='qd'&&st.panel==='t';
  let h='',lab='';

    const R=(x,y,w,hh,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${c}"/>`;
    h+=R(PAD,PAD,xd-PAD,yd-PAD,'#fdeef3')+R(xd,PAD,PAD+SPAN-xd,yd-PAD,'#f6e3eb')+R(PAD,yd,xd-PAD,PAD+SPAN-yd,'#f7f6f8')+R(xd,yd,PAD+SPAN-xd,PAD+SPAN-yd,'#eef6f1');

      const xs=its.map(it=>pos(it)[0]).sort((a,b)=>a-b),ys=its.map(it=>pos(it)[1]).sort((a,b)=>a-b);const md=a=>a[Math.floor(a.length*0.5)];
      const dim=(st.hi>=0&&st.hi!==k);const fs=18*zs;
      /* ふだんは番号の丸だけ。そのまとまりを押して強調したときだけ名前を出す */
      const lx=md(xs),ly=md(ys)-r*2.6,cc=COLS[k%COLS.length];
      if(st.labels===1&&st.hi===k)lab+=`<text class="mlab" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="${fs.toFixed(1)}" style="--c:${cc}">${esc(name)}</text>`;
      else{const br=21*zs;lab+=`<g class="mnum${dim?' dim':''}" style="--c:${cc}"><circle cx="${lx.toFixed(1)}" cy="${(ly-br*1.2).toFixed(1)}" r="${br.toFixed(2)}"/><text x="${lx.toFixed(1)}" y="${(ly-br*1.2).toFixed(1)}" font-size="${(24*zs).toFixed(2)}" dy="0.36em">${k+1}</text></g>`;if(st.labels===2)side.push({lx,cy:ly-br*1.2,br,name,cc,dim,fs})}});
    /* 番号＋名前：名前どうしが重ならないように置き場所を探す（右→左、だめなら上下にずらして細い線でつなぐ） */
    if(side.length){const cv=document.createElement('canvas').getContext('2d');const ff=getComputedStyle(svg).fontFamily;

        if(best.dy)lab+=`<line class="mlead${t.dim?' dim':''}" x1="${(t.lx+best.sd*t.br).toFixed(1)}" y1="${t.cy.toFixed(1)}" x2="${tx.toFixed(1)}" y2="${best.cy.toFixed(1)}" style="--c:${t.cc}"/>`;
        lab+=`<text class="mlab mside${t.dim?' dim':''}" x="${tx.toFixed(1)}" y="${best.cy.toFixed(1)}" dy="0.36em" font-size="${t.fs.toFixed(1)}" style="--c:${t.cc};text-anchor:${best.sd>0?'start':'end'}">${esc(t.name)}</text>`})}    /* 全体傾向（PCA）の軸の意味：いまの演題での見立て。作り直すと変わるので tools/map で再計算する */
    if(st.mode==='pc'){const yb=PAD+SPAN+40,xl=PAD-26,T=(x,y,t,rot)=>`<text class="qax" x="${x}" y="${y}" text-anchor="middle"${rot?` transform="rotate(-90 ${x} ${y})"`:''}>${t}</text>`;
      h+=T(PAD+SPAN*0.25,yb,'← 神経・発達・染色体')+T(PAD+SPAN*0.75,yb,'がん・カウンセリング →')
        +T(xl,PAD+SPAN*0.25,'周産期・生殖 →',1)+T(xl,PAD+SPAN*0.75,'← RNA・GWAS・分子解析',1);}
  }
  /* 選択中の演題と近い演題を線で結ぶ */
  if(st.sel!=null){const a=M.items[st.sel];const pa=pos(a);
    a.nb.forEach(j=>{const b=M.items[j];if(!vis(b))return;const pb=pos(b);h+=`<line class="mnb" x1="${pa[0]}" y1="${pa[1]}" x2="${pb[0]}" y2="${pb[1]}"/>`})}
  /* 点 */
  M.items.forEach((it,i)=>{if(!vis(it))return;const p=pos(it);const c=COLS[it.k%COLS.length];
    const hit=tagOn&&hitsOf(it).length>0;
    const dim=((st.hi>=0&&st.hi!==it.k)||(tagOn&&!hit))?' dim':'';const sel=st.sel===i?' sel':'';const th=hit?' thit':'';const m=marks(it);
    const rr=it.t==='p'?r*0.62:r;const sa=m.a&&st.rings.a,sb=m.b&&st.rings.b;
    const ring=(sa?`<circle class="mr" cx="${p[0]}" cy="${p[1]}" r="${(rr+r*0.75).toFixed(1)}" style="stroke:var(--pa)"/>`:'')+(sb?`<circle class="mr" cx="${p[0]}" cy="${p[1]}" r="${(rr+r*(sa?1.35:0.75)).toFixed(1)}" style="stroke:var(--pb)"/>`:'');
    const shape=`<circle class="pt${it.t==='p'?' p':''}${sel}${th}" cx="${p[0]}" cy="${p[1]}" r="${rr.toFixed(2)}" style="--c:${c}" data-i="${i}"/>`;
    h+=`<g class="pg${dim}">${ring}${shape}</g>`});
  if(st.labels)h+=lab;
  if(st.mode==='qd'){const xd=PAD+0.29*SPAN,cnt={tr:0,tl:0,br:0,bl:0};M.items.forEach(it=>{if(vis(it))cnt[quad(it)]++});
    const L=(x,y,anc,t,n,cls)=>`<text class="qlab ${cls}" x="${x}" y="${y}" text-anchor="${anc}">${esc(t)}<tspan class="qn"> ${n}件</tspan></text>`;
    h+=L(xd+12,PAD+30,'start',QN.tr,cnt.tr,'tr')+L(PAD+10,PAD+30,'start','盲点',cnt.tl,'tl')+L(xd+12,PAD+SPAN-14,'start','穴場',cnt.br,'br')+L(PAD+10,PAD+SPAN-14,'start','優先度低め',cnt.bl,'bl');
  }
  svg.innerHTML=h;
}
function legend(){
  const tagOn=st.tags.length>0;
  const tot=M.clusters.map((_,k)=>M.items.filter(it=>it.k===k&&vis(it)).length);
  const hit=M.clusters.map((_,k)=>M.items.filter(it=>it.k===k&&vis(it)&&hitsOf(it).length>0).length);
  $('mlegend').innerHTML=M.clusters.map((n,k)=>tot[k]?`<button type="button" class="mchip" data-k="${k}" aria-pressed="${st.hi===k}" style="--c:${COLS[k%COLS.length]}"><i>${k+1}</i>${esc(n)}<small>${tagOn?'当たり '+hit[k]+'/'+tot[k]:tot[k]}</small></button>`:'').join('');
  $('mlayers').innerHTML=[['t','シンポ'],['p','ポスター']].map(([k,v])=>`<button type="button" class="tab mly" data-l="${k}" aria-pressed="${st.layers[k]}"><i class="mli${k==='p'?' sm':''}"></i>${v}</button>`).join('')
    +((ROLE==='b'?[['b','AT','--pb'],['a','すい','--pa']]:[['a','すい','--pa'],['b','AT','--pb']]).map(([k,v,cv])=>`<button type="button" class="tab mly" data-rg="${k}" aria-pressed="${st.rings[k]}"><i class="mri" style="--rc:var(${cv})"></i>${v}</button>`).join(''))
    +`<button type="button" class="tab mly" data-lbsw="1" aria-pressed="${st.labels>0}" title="押すたびに なし→番号→番号＋名前">${['番号なし','番号','番号＋名'][st.labels]}</button>`
    +(HOVER?`<button type="button" class="tab mly" data-tipsw="1" aria-pressed="${st.tip}">フロート</button>`:'')
  ;
  [...$('mmode').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===st.mode));
  const pk=st.panel==='k';$('mlegend').hidden=!pk;const tp=$('mtags');tp.hidden=pk;
  [...$('mpsw').children].forEach(b=>{b.setAttribute('aria-pressed',b.dataset.ps===st.panel);if(b.dataset.ps==='t')b.textContent='注目タグ'+(st.tags.length?'（'+st.tags.length+'）':'')});
  if(!pk)tp.innerHTML=`<button type="button" class="chip clr" data-ta="all">✓ すべて選ぶ</button><button type="button" class="chip clr" data-ta="none">✕ すべて外す</button>`
    +TG().map(t=>`<button type="button" class="chip" data-tk="${esc(t.key)}" aria-pressed="${st.tags.includes(t.key)}" title="${esc(t.desc||'')}">${esc(t.label)}</button>`).join('');
  $('mnote').innerHTML='';
}
function card(){
  const el=$('mcard');if(st.sel==null){el.hidden=true;return}
  const it=M.items[st.sel];const f=info(it)||{ja:'',en:it.c,where:'',sess:''};const c=COLS[it.k%COLS.length];
  const tp=it.tp.map(t=>`<span class="mtp">${esc(M.topics[t]||t)}</span>`).join('');
  const lab=new Map(TG().map(t=>[t.key,t.label]));const hk=tagKeys(it);
  const tags=hk.length?hk.map(k=>`<span class="mtg${activeTags().includes(k)?' on':''}">${esc(lab.get(k)||k)}</span>`).join(''):'<span class="mtgn">なし</span>';
  const q=quad(it);
  const nb=it.nb.map(j=>{const b=M.items[j];const g=info(b)||{};return `<li><button type="button" class="mnbi" data-i="${j}"><span class="mcode" style="--c:${COLS[b.k%COLS.length]}">${esc(b.c)}</span><span class="mnbt">${esc(g.ja||g.en||'')}</span></button></li>`}).join('');
  const go=it.t==='t'?`<button type="button" class="mgo" data-go="t">シンポジウムで開く →</button>`:`<button type="button" class="mgo" data-go="p">ポスターで開く →</button>`;
  el.innerHTML=`<div class="mch"><span class="mcode" style="--c:${c}">${esc(it.c)}</span><span class="mclu" style="--c:${c}">${esc(M.clusters[it.k])}</span><button type="button" class="mx" aria-label="閉じる">×</button></div>
    <div class="mja">${esc(f.ja||f.en)}</div>${f.ja&&f.en?`<div class="men">${esc(f.en)}</div>`:''}
    <div class="mwhere">${esc(f.where)}${f.sess?'　<span>'+esc(f.sess)+'</span>':''}</div>
    <div class="mrowk"><span class="mk">トピック</span><span class="mtps">${tp}</span></div>
    <div class="mrowk"><span class="mk">注目タグ</span><span class="mtps">${tags}</span></div>
    ${go}
    <div class="msec">内容が近い演題</div><ul class="mnbl">${nb}</ul>`;
  el.hidden=false;
}
function render(){legend();draw();card()}
window.__mapShow=()=>{tagCache.clear();render()};

/* ---- 操作 ---- */
const svg=$('msvg'),box=$('mapbox');
function toSvg(cx,cy){const r=svg.getBoundingClientRect();const s=Math.min(r.width,r.height)*(1/st.vb[2]);const ox=(r.width-st.vb[2]*s)*0.5,oy=(r.height-st.vb[3]*s)*0.5;return [st.vb[0]+(cx-r.left-ox)*(1/s),st.vb[1]+(cy-r.top-oy)*(1/s)]}
function zoomAt(f,cx,cy){const p=cx==null?[st.vb[0]+st.vb[2]*0.5,st.vb[1]+st.vb[3]*0.5]:toSvg(cx,cy);
  let w=Math.min(1000,Math.max(120,st.vb[2]*f));const k=w*(1/st.vb[2]);
  st.vb=[p[0]-(p[0]-st.vb[0])*k,p[1]-(p[1]-st.vb[1])*k,w,w];draw()}
function select(i,center){st.sel=i;if(center&&i!=null){const p=pos(M.items[i]);const w=st.vb[2];st.vb=[p[0]-w*0.5,p[1]-w*0.5,w,w]}draw();card();
  if(i!=null){const el=$('mcard');setTimeout(()=>el.scrollIntoView({block:'nearest',behavior:'smooth'}),30)}}
$('mzin').onclick=()=>zoomAt(0.6);$('mzout').onclick=()=>zoomAt(1.6);$('mzreset').onclick=()=>{st.vb=[0,0,1000,1000];draw()};
/* タップ位置にいちばん近い点を選ぶ（点が小さくても指で押せるように、半径lim px以内） */
function nearest(x,y,lim){let bi=-1,bd=lim*lim;svg.querySelectorAll('.pt').forEach(el=>{const R=el.getBoundingClientRect();const dx=R.left+R.width*0.5-x,dy=R.top+R.height*0.5-y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=+el.dataset.i}});return bi}
/* ドラッグ移動・2本指ピンチ・タップ選択 */
const P=new Map();let drag=null,pinch=null,moved=false;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);moved=false;
  if(P.size===1)drag={x:e.clientX,y:e.clientY,vb:st.vb.slice()};
  if(P.size===2){const [a,b]=[...P.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),vb:st.vb.slice(),c:[(a[0]+b[0])*0.5,(a[1]+b[1])*0.5]};drag=null}});
svg.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&P.size===2){const [a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d<10)return;st.vb=pinch.vb.slice();zoomAt(pinch.d*(1/d),pinch.c[0],pinch.c[1]);moved=true;return}
  if(drag){const r=svg.getBoundingClientRect();const s=Math.min(r.width,r.height)*(1/st.vb[2]);const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
    if(moved){st.vb=[drag.vb[0]-dx*(1/s),drag.vb[1]-dy*(1/s),st.vb[2],st.vb[3]];draw()}}});
const up=e=>{const was=P.size;P.delete(e.pointerId);if(P.size<2)pinch=null;
  if(was===1&&!moved){const i=nearest(e.clientX,e.clientY,e.pointerType==='mouse'?12:26);if(i>=0)select(i,false);else if(st.sel!=null){select(null)}}
  if(P.size===0)drag=null};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',e=>{P.delete(e.pointerId);pinch=null;drag=null});
/* マウスを点に重ねたら、その点の横に小さなフロート（演題の概要）を出す。フロートに移ってクリックすると詳細へ。スマホはタップで下の詳細カード */
const tip=document.createElement('div');tip.className='mtip';tip.hidden=true;box.appendChild(tip);let tipI=-1,tipT=0;
const tipHide=()=>{clearTimeout(tipT);tipT=setTimeout(()=>{tip.hidden=true;tipI=-1},260)};
svg.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;
  const pt=(P.size||!st.tip)?null:e.target.closest('.pt');if(!pt){if(!tip.hidden)tipHide();return}
  clearTimeout(tipT);const i=+pt.dataset.i;const it=M.items[i];if(!it||i===tipI)return;
  tipI=i;const f=info(it)||{ja:'',en:it.c,where:'',sess:''};const c=COLS[it.k%COLS.length];
  tip.innerHTML=`<div class="mth"><span class="mcode" style="--c:${c}">${esc(it.c)}</span><span class="mclu" style="--c:${c}">${esc(M.clusters[it.k])}</span></div><div class="mtt">${esc(f.ja||f.en)}</div>${f.where?`<div class="mtw">${esc(f.where)}</div>`:''}<div class="mtk">ここをクリックで詳細 →</div>`;tip.hidden=false;
  const R=box.getBoundingClientRect(),B=pt.getBoundingClientRect();const cx=B.left+B.width*0.5-R.left,cy=B.top+B.height*0.5-R.top,g=B.width*0.5+4;
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=cx+g,y=cy-h*0.5;if(x+w>R.width-6)x=cx-g-w;
  tip.style.left=Math.max(6,x)+'px';tip.style.top=Math.max(6,Math.min(R.height-h-6,y))+'px'});
svg.addEventListener('pointerleave',tipHide);
tip.addEventListener('pointerenter',()=>clearTimeout(tipT));tip.addEventListener('pointerleave',tipHide);
tip.addEventListener('click',()=>{const i=tipI;tip.hidden=true;tipI=-1;if(i>=0)select(i)});
svg.addEventListener('pointerdown',()=>{clearTimeout(tipT);tip.hidden=true;tipI=-1});
box.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zoomAt(e.deltaY>0?1.15:0.87,e.clientX,e.clientY)},{passive:false});
document.addEventListener('click',e=>{
  if(!e.target.closest('#mp'))return;
  const ch=e.target.closest('.mchip');if(ch){const k=+ch.dataset.k;st.hi=st.hi===k?-1:k;render();return}
  const rg=e.target.closest('[data-rg]');if(rg){const k=rg.dataset.rg;st.rings[k]=!st.rings[k];save();render();return}
  if(e.target.closest('[data-tipsw]')){st.tip=!st.tip;save();render();return}
  if(e.target.closest('[data-lbsw]')){st.labels=(st.labels+1)%3;save();render();return}
  const ps=e.target.closest('[data-ps]');if(ps){st.panel=ps.dataset.ps;if(st.panel==='t')st.hi=-1;save();render();return}
  const ta=e.target.closest('[data-ta]');if(ta){st.tags=ta.dataset.ta==='all'?TG().map(t=>t.key):[];save();render();return}
  const tk=e.target.closest('[data-tk]');if(tk){const k=tk.dataset.tk;st.tags=st.tags.includes(k)?st.tags.filter(x=>x!==k):st.tags.concat(k);save();render();return}
  const ly=e.target.closest('.mly[data-l]');if(ly){const k=ly.dataset.l;st.layers[k]=!st.layers[k];if(!st.layers.t&&!st.layers.p)st.layers[k==='t'?'p':'t']=true;if(st.sel!=null&&!st.layers[M.items[st.sel].t])st.sel=null;save();render();return}
  const md=e.target.closest('#mmode button');if(md){st.mode=md.dataset.m;st.vb=[0,0,1000,1000];save();render();return}
  if(e.target.closest('.mx')){select(null);return}
  const nb=e.target.closest('.mnbi');if(nb){const j=+nb.dataset.i;const b=M.items[j];if(!st.layers[b.t]){st.layers[b.t]=true;save();legend()}select(j,true);return}
  const go=e.target.closest('.mgo');if(go&&st.sel!=null){const it=M.items[st.sel];
    if(it.t==='t'){window.__show&&window.__show('tt');setTimeout(()=>window.__ttOpen&&window.__ttOpen(it.c),60)}
    else{window.__show&&window.__show('pv');setTimeout(()=>window.__pvSheet&&window.__pvSheet(it.c),60)}}
});
})();
</script>

  const m=S.marks[p.code]||{};const n=(S.memos[p.code]||[]).length;
  return `<article class="card t-${p.tier}" data-code="${p.code}">
    <button class="cbody" type="button" data-open="${p.code}">
      <div class="meta"><span class="code">${p.code}</span><span class="when">${PDAYS[p.day-1].short} ${(PDAYS[p.day-1].disc||'').split('–')[0]}</span>${p.cat?`<span class="pcat">${esc(p.cat)}</span>`:''}<span class="why t-${p.tier}">${why(p)}</span></div>
      ${p.ja?`<div class="ja">${hl(p.ja)}</div><div class="ttl">${hl(p.title)}</div>`:`<div class="ja">${hl(p.title)}</div>`}
      <div class="au1">${auShort(p.authors)}</div>
      <div class="aff">${hl(p.affil)}</div>
    </button>
    ${goers(p.code)}
    <div class="foot">
      <button type="button" class="pick a" data-pick="a" aria-pressed="${!!m.a}">すいすい</button>
      <button type="button" class="pick b" data-pick="b" aria-pressed="${!!m.b}">AT</button>
      <button type="button" class="memo-n${n?' has':''}" data-open="${p.code}">メモ ${n}</button>
    </div></article>`;
}
function matches(p){
  if(S.day&&p.day!==S.day)return false;
  if(S.fA&&!(S.marks[p.code]||{}).a)return false;
  if(S.fB&&!(S.marks[p.code]||{}).b)return false;
  if(S.fMemo&&!(S.memos[p.code]||[]).length)return false;
  if(S.theme&&(S.theme==="その他"?p.theme!=="その他":!p.tags.includes(S.theme)))return false;
  if(S.tsel.length){const L=TAGS.filter(t=>S.tsel.includes(t.key)).map(t=>t.label);if(!L.some(l=>p.tags.includes(l)))return false}
  const t=S.q.trim().toLowerCase();if(!t)return true;
  const hay=[p.code,p.title,p.ja,p.affil,p.authors,p.abs,p.abs_ja||"",p.theme].join(" ").toLowerCase();
  return t.split(/\s+/).every(w=>hay.includes(w));
}

  $("ppdays").innerHTML=[{k:"",short:"全日"},...PDAYS].map(d=>`<button type="button" class="tab" data-pday="${d.k}" aria-pressed="${(S.day||"")===d.k}" style="--dc:var(--d${d.k||0})">${d.short}</button>`).join("");
  const on={a:S.fA,b:S.fB,m:S.fMemo,t:S.tsel.length>0};

  $("ptchips").hidden=!S.tagOpen;$("pv").dataset.me=PV_ME;
  const ths=["",...TAGS.map(t=>t.label),"その他"];
  $("pthemes").innerHTML=ths.map(t=>{const c=DATA.filter(p=>t==="その他"?p.theme==="その他":p.tags.includes(t)).length;if(t&&!c)return"";return `<button type="button" class="chip" data-theme="${esc(t)}" aria-pressed="${S.theme===t}">${t?esc(t)+" "+c:"全テーマ"}</button>`}).join("");
  const rows=DATA.filter(matches);
  $("pcount").textContent=rows.length+" / "+DATA.length+" 件";
  /* 今の状態を1行で：全部なのか、何で絞っているのか */
  const conds=[];if(S.day)conds.push(PDAYS[S.day-1].short);if(S.fA)conds.push("すいすいの印");if(S.fB)conds.push("ATの印");if(S.fMemo)conds.push("メモあり");
  if(S.tsel.length)conds.push(TAGS.filter(t=>S.tsel.includes(t.key)).map(t=>t.label).join("/"));if(S.q.trim())conds.push("「"+S.q.trim()+"」");
  $("pstatus").innerHTML=conds.length?`<span class="pst-on"><b>${esc(conds.join("・"))}</b> で絞り込み中　${rows.length}件</span><button type="button" class="pst-clr" id="pclear">× 解除</button>`:`<span class="pst-all">全${DATA.length}件を表示中</span>`;

  const oth=DATA.filter(p=>p.tier==="oth").length;

  let html=["hot","oth"].map(k=>{const rs=rows.filter(p=>p.tier===k);if(!rs.length)return"";
    const head=`<h2>${TIERS[k].name}<small>${rs.length}件</small></h2><p class="why">${TIERS[k].why}</p>`;
    if(k==="oth"&&!flat){
      const groups=[...TAGS.map(t=>t.label),"その他"].map(t=>[t,rs.filter(p=>p.theme===t)]).filter(g=>g[1].length);

    }

<script>
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  let el=null,sx=0,sl=0,drag=false,moved=false;
  document.addEventListener('pointerdown',e=>{
    if(e.button!==0||e.pointerType!=='mouse')return;
    const s=e.target.closest&&e.target.closest('.scroll');if(!s)return;
    if(e.target.closest('input,textarea,select,a'))return;
    el=s;sx=e.clientX;sl=s.scrollLeft;drag=true;moved=false;
  },{capture:true});
  document.addEventListener('pointermove',e=>{
    if(!drag||!el)return;const dx=e.clientX-sx;
    if(!moved&&Math.abs(dx)<6)return;
    if(!moved){moved=true;el.classList.add('dragging')}
    el.scrollLeft=sl-dx;
  },{capture:true,passive:true});
  const end=()=>{if(!drag)return;drag=false;if(el)el.classList.remove('dragging');if(moved){const stop=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener('click',stop,{capture:true,once:true});setTimeout(()=>document.removeEventListener('click',stop,{capture:true}),300)}el=null};
  document.addEventListener('pointerup',end,{capture:true});document.addEventListener('pointercancel',end,{capture:true});
  document.addEventListener('keydown',e=>{
    if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
    const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
    const list=[...document.querySelectorAll('.scroll')].filter(s=>s.offsetParent!==null);
    const vh=innerHeight;const s=list.find(x=>{const r=x.getBoundingClientRect();return r.bottom>0&&r.top<vh})||list[0];if(!s)return;
    s.scrollBy({left:e.key==='ArrowRight'?260:-260,behavior:'smooth'});e.preventDefault();
  });
})();
</script>

<script>
(function(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  const MIN=70,MAX=320,MINI_AT=120;let cw=180;
  let stored=false;try{const v=parseInt(localStorage.getItem('jshg2026cw')||'');if(v>=MIN&&v<=MAX){cw=v;stored=true}}catch(e){}
  const fit=()=>{const s=document.querySelector('.scroll');const tt=s&&s.querySelector('.tt');const nr=tt?parseInt(getComputedStyle(tt).getPropertyValue('--nr'))||4:4;const w=(s?s.clientWidth:innerWidth)-24;return Math.max(MIN,Math.min(MAX,Math.floor(w/nr)))};
  const tip=document.createElement('div');tip.className='zoomtip';document.body.appendChild(tip);let tt=0;
  const showTip=()=>{tip.textContent='列幅 '+cw+'px（Ctrl＋ホイールで調整／Ctrl＋0で画面幅に合わせる）';tip.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>tip.classList.remove('on'),1200)};
  const setMini=on=>{if(document.body.classList.contains('mini')===on)return;const b=document.querySelector('#minib button[data-m="'+(on?1:0)+'"]');if(b)b.click()};
  const apply=(s,x)=>{
    document.documentElement.style.setProperty('--cw',cw+'px');
    setMini(cw<MINI_AT);
    try{localStorage.setItem('jshg2026cw',String(cw))}catch(e){}
    showTip();
  };
  const zoom=(dir,s,x)=>{
    const old=cw;cw=Math.max(MIN,Math.min(MAX,Math.round(cw*(dir>0?1.12:1/1.12))));if(cw===old)return;
    const sl=s?s.scrollLeft:0;apply();
    if(s&&!document.body.classList.contains('mini')){const r=cw/old;s.scrollLeft=(sl+x)*r-x}
  };
  document.addEventListener('wheel',e=>{
    if(!e.ctrlKey)return;const s=e.target.closest&&e.target.closest('.scroll');if(!s)return;
    e.preventDefault();const x=e.clientX-s.getBoundingClientRect().left;zoom(e.deltaY<0?1:-1,s,x);
  },{passive:false,capture:true});
  document.addEventListener('keydown',e=>{
    if(!e.ctrlKey)return;const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
    const s=[...document.querySelectorAll('.scroll')].find(x=>x.offsetParent!==null);
    if(e.key==='+'||e.key==='='||e.key===';'){e.preventDefault();zoom(1,s,s?s.clientWidth/2:0)}
    else if(e.key==='-'){e.preventDefault();zoom(-1,s,s?s.clientWidth/2:0)}
    else if(e.key==='0'){e.preventDefault();cw=fit();apply()}
  });
  document.documentElement.style.setProperty('--cw',cw+'px');
  const init=()=>{if(!stored){const v=fit();if(v!==cw){cw=v;document.documentElement.style.setProperty('--cw',cw+'px')}}setMini(cw<MINI_AT)};
  setTimeout(init,0);setTimeout(init,400);
})();
</script>

<script>
/* 詳細フロート：要旨などを開いて中身が伸びたら、画面下にはみ出さないよう位置と高さを合わせ直す */
(function(){
  const sh=document.getElementById('sheet'),sb=document.getElementById('sbody');if(!sh||!sb)return;
  const si=sh.firstElementChild;
  function fit(){if(sh.hidden)return;const bb=document.getElementById('bbar');const vh=window.innerHeight-(bb?bb.offsetHeight:0);
    const prev=si.style.maxHeight;si.style.maxHeight='none';const need=si.offsetHeight;
    let top=parseFloat(si.style.marginTop)||12;if(top+need>vh-12)top=Math.max(12,vh-12-need);
    si.style.marginTop=Math.round(top)+'px';si.style.maxHeight=Math.max(160,Math.round(vh-12-top))+'px'}
  sb.addEventListener('toggle',()=>{requestAnimationFrame(fit)},true);
  window.addEventListener('resize',()=>{requestAnimationFrame(fit)});
  new MutationObserver(()=>{setTimeout(fit,450)}).observe(sb,{childList:true});
  new MutationObserver(()=>{if(sh.hidden)si.style.maxHeight=''}).observe(sh,{attributes:true,attributeFilter:['hidden']});
})();
</script>
