.hbar{position:fixed;left:0;right:0;bottom:var(--bbar-h,0px);z-index:24;height:16px;overflow-x:auto;overflow-y:hidden;background:color-mix(in srgb,var(--bg) 85%,transparent);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-color:var(--accent) var(--line)}
@media (hover:hover) and (pointer:fine){
  .scroll::-webkit-scrollbar{display:none}
}
@media not ((hover:hover) and (pointer:fine)){
  .hbar{display:none!important}
}
.ttb{position:relative;display:grid;grid-template-columns:24px repeat(var(--nr,4),minmax(0,1fr));gap:6px;margin-top:12px}
body.mini .tt{min-width:0}
body.mini .tth,body.mini .ttb{grid-template-columns:18px repeat(var(--nr,4),minmax(0,1fr));gap:2px}
body.mini .rh{justify-content:center}
body.mini .rh small{display:none}
body.mini .rh .rn{font-size:0;padding:1px 0;width:100%;text-align:center}
body.mini .rh .rn::after{content:attr(data-s);font-size:.72rem}
body.mini .slot{gap:0}
body.mini .slot .who2{display:none}
body.mini .slot .sess{padding:2px 1px;border-radius:6px;border-width:0;justify-content:center;align-items:center}
body.mini .slot .sess::after{display:none}
body.mini .sess .meta{margin:0;justify-content:center}
body.mini .sess .meta>*:not(.code){display:none}
body.mini .sess .code{font-size:.62rem;padding:0 1px;background:none}
body.mini .sess .sname,body.mini .sess .cspk,body.mini .sess .cchair{display:none}
body.mini .slot:has(.pick.a[aria-pressed=true]) .sess{box-shadow:inset 4px 0 0 var(--pa)}
body.mini .slot:has(.pick.b[aria-pressed=true]) .sess{box-shadow:inset -4px 0 0 var(--pb)}
body.mini .slot:has(.pick.a[aria-pressed=true]):has(.pick.b[aria-pressed=true]) .sess{box-shadow:inset 4px 0 0 var(--pa),inset -4px 0 0 var(--pb)}
body.mini .slot.both .sess{animation:none;border:0;background:var(--kbg)}
body.mini .tick{font-size:.64rem}
body.mini .route-svg .rl{stroke-width:2.5}
body.mini .route-svg .rg{stroke-width:6}
.sess[data-kind="ora"],#sbody[data-kind="ora"]{--kc:var(--ora);--kbg:var(--ora-bg)}
.sess[data-kind="lun"],#sbody[data-kind="lun"]{--kc:var(--lun);--kbg:var(--lun-bg)}
.sess[data-kind="pos"],#sbody[data-kind="pos"]{--kc:var(--pos);--kbg:var(--pos-bg)}
.sess[data-kind="awd"],#sbody[data-kind="awd"]{--kc:var(--awd);--kbg:var(--awd-bg)}
.sess[data-kind="oth"],#sbody[data-kind="oth"]{--kc:var(--oth);--kbg:var(--oth-bg)}
.tth .rh{flex-wrap:nowrap;white-space:nowrap;align-items:center;min-width:0;overflow:hidden}
.tth .rh small{display:inline;width:auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tth .rh .rn{flex:none}
.rtog button.a[aria-pressed=true]{background:var(--pa);border-color:var(--pa);color:#fff}
.rtog button.b[aria-pressed=true]{background:var(--pb);border-color:var(--pb);color:#fff}
body.pmode .rtog{display:none}
.route-svg{position:absolute;left:0;top:0;z-index:3;pointer-events:none;overflow:visible}
.route-svg .rl{fill:none;stroke-width:3.5;stroke-linecap:round;opacity:.9}
.route-svg .rr{stroke-width:3;opacity:.95}
.route-svg rect.rg{stroke-width:12;opacity:.28}
.route-svg .rg{fill:none;stroke-width:10;opacity:.22;stroke-linecap:round}
.route-svg .dash{stroke-dasharray:7 6}
.route-svg .rs{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-dasharray:3 97;filter:drop-shadow(0 0 4px #fff);display:none}
@media (prefers-reduced-motion:reduce){
  .route-svg .rs{display:none}
}
.hband{position:absolute;left:0;right:0;z-index:3;pointer-events:none;border-radius:12px;background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:inset 0 0 0 3px var(--accent),0 0 22px 6px color-mix(in srgb,var(--accent) 45%,transparent);animation:hblink .45s ease-in-out 6 alternate;transition:opacity .5s}
.hband.out{opacity:0}
@keyframes hblink{from{opacity:.2}to{opacity:1}}
.tick.hit{color:#fff!important;background:var(--accent);border-radius:999px;left:2px;right:2px;animation:hblink .45s ease-in-out 6 alternate}
@media (prefers-reduced-motion:reduce){
  .hband,.tick.hit{animation:none}
}
.ttb>.axis,.tth>div:first-child{position:sticky;left:0;z-index:4;background:var(--axis);border-radius:8px}
.ttb>.axis{box-shadow:3px 0 6px -4px rgba(30,35,90,.35);border-radius:0 0 8px 8px}
.tth>div:first-child{border-radius:8px 8px 0 0;margin-bottom:-4px;box-shadow:3px 0 6px -4px rgba(30,35,90,.35)}
.tick{position:absolute;transform:translateY(-.6em);font-family:var(--mono);font-size:.72rem;font-weight:700;left:0;right:0;text-align:center;color:var(--axis-fg)}

.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px;padding-bottom:calc(var(--bbar-h,70px) + 32px);position:relative;z-index:1}
.roletag{margin-left:auto;font-size:.68rem;font-weight:800;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 8px;white-space:nowrap}
h1 .roletag+.swlink{margin-left:6px!important}
#pv .wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 60px}
#pv h1{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0 0 4px;text-wrap:balance}
#pv h1 .y{display:inline-block;width:36px;height:36px;border-radius:9px;margin-right:.2em;transform:rotate(-3deg);box-shadow:0 2px 6px -2px rgba(40,20,30,.4);flex:none}
#pv .hd{display:flex;align-items:center;gap:6px;margin:0}
#pv .frow{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:8px;align-items:center}
#pv .fl{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
#pv .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
#pv input,#pv textarea{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 10px}
#pv input[type=search]{flex:1 1 160px;min-width:0;font-size:.9rem}
#pv input:focus-visible,#pv textarea:focus-visible,#pv button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pv .count{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
#pv .tabs{display:flex;gap:5px}
#pv .tabs .tab{flex:1 1 auto;padding-inline:6px}
#pv .tabs .tab[data-tier="a"][aria-pressed=true]{background:var(--pa);border-color:var(--pa)}
#pv .tabs .tab[data-tier="b"][aria-pressed=true]{background:var(--pb);border-color:var(--pb)}
@media (max-width:380px){
  #pv .tabs .tab{font-size:.7rem;padding-inline:4px}
}
#pv .pdays .tab[aria-pressed=true]{background:var(--dc,var(--accent));border-color:var(--dc,var(--accent))}
#pv .pdays .tab{border-color:var(--dc,var(--line))}
#pv .dchip{font-weight:800;color:#fff;background:var(--dc);border-radius:999px;padding:0 7px;white-space:nowrap}
#pv .tabdesc{margin:0;font-size:.74rem;color:var(--muted);line-height:1.4}
#pv .copybar{display:flex;flex-direction:column;gap:6px;margin-top:14px}
#pv .copybtn{font:inherit;font-weight:800;font-size:.86rem;border:0;border-radius:999px;padding:9px 14px;background:var(--fg);color:var(--bg);cursor:pointer}
#pv .copybar textarea{font-family:var(--mono);font-size:.74rem;min-height:9em;width:100%;box-sizing:border-box}
#pv .tab{font:inherit;font-weight:700;font-size:.8rem;padding:5px 4px;border:2px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);cursor:pointer;text-align:center;white-space:nowrap}
#pv .tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
#pv .chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
#pv .chips::-webkit-scrollbar{display:none}
#pv .chipwrap{position:relative;min-width:0}
#pv .chipwrap::before,#pv .chipwrap::after{content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;opacity:0;transition:opacity .2s}
#pv .chipwrap::before{left:0;background:linear-gradient(to right,var(--bg) 35%,transparent)}
#pv .chipwrap::after{right:0;background:linear-gradient(to left,var(--bg) 35%,transparent)}
#pv .chipwrap.ml::before,#pv .chipwrap.mr::after{opacity:1}
#pv .sarr{position:absolute;top:50%;transform:translateY(-50%);z-index:1;width:22px;height:22px;border-radius:50%;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:.9rem;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0 0 2px}
#pv .sarr.l{left:0}
#pv .sarr.r{right:0}
#pv .chipwrap.ml .sarr.l,#pv .chipwrap.mr .sarr.r{display:flex}
@keyframes nudge{50%{transform:translate(3px,-50%)}}
#pv .chipwrap.mr .sarr.r{animation:nudge 1.2s ease-in-out 3}
@media (prefers-reduced-motion:reduce){
  #pv .chipwrap.mr .sarr.r{animation:none}
}
#pv .chip{font:inherit;font-size:.74rem;font-weight:500;white-space:nowrap;padding:3px 10px;border:0;border-radius:999px;background:var(--chip);color:var(--fg);cursor:pointer}
#pv .chip[aria-pressed=true]{background:var(--fg);color:var(--bg)}
#pv .tier{margin-top:18px}
#pv .tier h2{display:inline-flex;gap:.5em;align-items:baseline;font-family:var(--display);font-size:1.02rem;color:#fff;background:var(--tc);padding:3px 14px;border-radius:999px;margin:0 0 4px}
#pv .tier h2 small{font-family:var(--font);font-size:.72rem;opacity:.9}
#pv .tier .why{font-size:.74rem;color:var(--muted);margin:0 0 8px}
#pv .tier.must{--tc:var(--must);--tbg:var(--must-bg)}
#pv .tier.hot{--tc:var(--hot);--tbg:var(--hot-bg)}
#pv .tier.oth{--tc:var(--oth);--tbg:var(--oth-bg)}
#pv .list{display:flex;flex-direction:column;gap:8px}
#pv .card:hover{border-color:var(--tc)}
#pv .cbody{all:unset;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
#pv .code{font-family:var(--mono);font-weight:500;background:var(--tbg);color:var(--tc);padding:0 6px;border-radius:5px}
#pv .theme{color:var(--muted)}
#pv .flag.pharma{background:var(--pharma-bg);color:var(--pharma)}
#pv .flag.corp{background:var(--chip);color:var(--muted)}
#pv .flag.kw,#pv .flag.gwas{background:var(--gwas-bg);color:var(--gwas)}
#pv .flag.okada{background:var(--okada-bg);color:var(--okada)}
#pv .foot{display:flex;gap:5px;align-items:center}
#pv .foot .pick{flex:1 1 0;min-width:0}
#pv .foot .memo-n{flex:none;margin-left:auto}
#pv .skip{font:inherit;font-size:.74rem;font-weight:700;border:0;background:none;color:var(--muted);cursor:pointer;padding:5px 4px;white-space:nowrap}

/* ==== 2択・まとめ操作を「それとわかる形」に ==== */
/* 詳細／全体：画面切替と同じつまみ型（薄い帯の中で、選んでいる方だけ色付き） */
#minib.vseg{background:var(--accent-soft)!important;border-radius:999px;padding:3px;gap:2px;box-sizing:border-box;width:auto;min-width:0;align-self:center}
#minib.vseg button,.drow #minib.vseg button,.drow #minib.vseg button[aria-pressed=true]{border:0!important;background:transparent;color:var(--accent);min-height:40px!important;height:40px!important;font-size:.88rem!important;font-weight:800;width:auto;min-width:56px;max-width:none;padding:0 12px;box-shadow:none;border-radius:999px}
#minib.vseg button[aria-pressed=true],.drow #minib.vseg button[aria-pressed=true]{background:var(--accent)!important;color:#fff;box-shadow:0 2px 6px -2px rgba(80,30,50,.45)}
@media (min-width:700px){#minib.vseg button,.drow #minib.vseg button,.drow #minib.vseg button[aria-pressed=true]{min-height:28px!important;height:28px!important;font-size:.84rem!important}}
/* EN／JP：両方選べるので、1つの帯にまとめ、選んでいる方に✓ */
#langs{background:var(--accent-soft);border-radius:999px;padding:3px;gap:2px!important;align-items:center}
#langs .tab,#bar .srow #langs .tab{border:0!important;background:transparent;color:var(--accent);box-shadow:none;border-radius:999px;font-weight:800;min-height:30px;height:30px;padding:0 10px}
#langs .tab[aria-pressed=true]{background:var(--accent);color:#fff;box-shadow:0 2px 6px -2px rgba(80,30,50,.45)}
#langs .tab::before{content:'✓ ';font-weight:900;visibility:hidden}
#langs .tab[aria-pressed=true]::before{visibility:visible}
#langs .tab{min-width:4.2em;text-align:center}
/* すべて選ぶ／すべて外す：タグとは別物の「操作ボタン」として、左右がくっついた1組に */
.chip.clr{background:var(--panel)!important;border:1.5px solid var(--accent)!important;color:var(--accent)!important;font-weight:800;border-style:solid!important}
.chip.clr:has(+ .chip.clr){border-radius:999px 0 0 999px!important;margin-right:-3px;border-right-width:.75px!important}

(function(){

  const CHIPS=['long-read','single-cell','GWAS','polygenic','splicing','RNA','epigen','AI','machine learning','WGS','rare disease','cancer','ALS','iPS','drug','therap'];
  const $=id=>document.getElementById(id);
  const q=$('q'),langSel={value:''},out=$('out'),tabs=$('tabs'),chips=$('chips'),count=$('count');

  /* 旧セッション記号→新記号（口演 OS1→O1、受賞 AW1→BO など）。保存済みの印を引き継ぐ */
  const MIG=p=>{const o=Object.assign({},p||{});for(const k of Object.keys(o)){let n=null;const m=k.match(/^OS(\d+)$/);if(m)n='O'+m[1];else if(k==='AW1')n='BO';else if(k==='AW2')n='JHG';else if(k==='AW3')n='AL';if(n&&!o[n])o[n]=o[k]}return o};
  const STATE=(()=>{try{return JSON.parse(document.getElementById('state').textContent)||{}}catch(e){return {}}})();
  let day=DAYS[0], openKey=null, plan=MIG(STATE.plan||{}), labels=Object.assign({a:'すいすい',b:'AT'},STATE.labels||{}), art=null, canWrite=true;
  let pendingNewer=false,animKey=null;try{const pd=JSON.parse(localStorage.getItem('jshg2026pending')||'null');if(ROLE&&pd&&pd.ts>(STATE.ts||0)){plan=MIG(pd.plan||plan);labels=Object.assign(labels,pd.labels||{});pendingNewer=true}else localStorage.removeItem('jshg2026pending')}catch(e){}
  const la=$('la'),lb=$('lb'),status=$('status');
  DAYS.forEach((d,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=d;b.dataset.s=d.replace(/^\d+\/(\d+)\((.)\)$/,'$1$2');b.setAttribute('aria-pressed',i===0);b.onclick=()=>{day=d;[...tabs.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render()};tabs.appendChild(b)});

  const TSEL=new Set();try{(JSON.parse(localStorage.getItem('jshg2026tags')||'[]')).forEach(k=>TSEL.add(k))}catch(e){}

  const absTxt=i=>(i.abs||'')+' '+(i.abs_ja||i.absja||'');
  const tagHit=(i,t)=>t.re.test(t.field==='affil'?((i.affil||'')+' '+(i.affils||[]).join(' ')):t.field==='authors'?((i.speaker||'')+' '+(i.authors||'')+' '+(i.chairs||'')):(i.session+' '+(SJA[i.code.split('-')[0]]||'')+' '+i.title+' '+i.ja+' '+absTxt(i)));

    if(!x.authors){return (x.speaker||x.affil)?`<div class="who">${hl(x.speaker||'',terms)}${x.affil?`（${hl(x.affil,terms)}）`:''}</div>`:''}

  function buildChips(){if(typeof TAGS==='undefined')return;chips.innerHTML='';tagSum();
    const all=document.createElement('button');all.className='chip clr';all.type='button';all.textContent='✓ すべて選ぶ';all.onclick=()=>{TAGS.forEach(t=>TSEL.add(t.key));buildChips();try{localStorage.setItem('jshg2026tags',JSON.stringify([...TSEL]))}catch(e){};render()};chips.appendChild(all);
    const c=document.createElement('button');c.className='chip clr';c.type='button';c.textContent='✕ すべて外す';c.onclick=()=>{TSEL.clear();buildChips();try{localStorage.removeItem('jshg2026tags')}catch(e){};render()};chips.appendChild(c);
    TAGS.forEach(t=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=t.label;b.title=t.desc;b.setAttribute('aria-pressed',TSEL.has(t.key));
      b.onclick=()=>{if(TSEL.has(t.key))TSEL.delete(t.key);else TSEL.add(t.key);b.setAttribute('aria-pressed',TSEL.has(t.key));tagSum();try{localStorage.setItem('jshg2026tags',JSON.stringify([...TSEL]))}catch(e){};render()};chips.appendChild(b)})}
  document.addEventListener('DOMContentLoaded',()=>{buildChips();if(TSEL.size)render()});
  try{const s=localStorage.getItem('jshg2026q');if(s)q.value=s}catch(e){}
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const rx=t=>new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const hl=(s,terms)=>{let h=esc(s);terms.forEach(t=>{h=h.replace(rx(t),m=>`<mark>${m}</mark>`)});return h};
  const tmin=t=>{const[a,b]=t.split('-')[0].split(':').map(Number);return a*60+b};
  const match=(i,terms)=>{
    if(langSel.value&&i.lang!==langSel.value)return false;
    const hay=(i.session+' '+(SJA[i.code.split('-')[0]]||'')+' '+i.title+' '+i.ja+' '+i.speaker+' '+(i.authors||'')+' '+i.affil+' '+(i.affils||[]).join(' ')+' '+i.chairs+' '+i.code+' '+absTxt(i)).toLowerCase();

        setTimeout(()=>{const li=[...document.querySelectorAll('#sbody .talk')].find(l=>{const t=l.querySelector('.tc');return t&&t.textContent===code});if(li){li.scrollIntoView({block:'nearest'});li.classList.add('jumped')}},500)},380)},80)};
  const SJA={S1:'東アジアにおけるヒト遺伝学の推進：次世代のヒト遺伝学をつなぐ',S5:'精密医療のためのAI駆動型遺伝学',S7:'がん患者に対する包括的な生殖細胞系列解析の確立：多遺伝子パネル検査（MGPT）から全ゲノム解析（WGS）へのロードマップ',S11:'RASopathies：これまでの歩みと今後の展望'};
  const CRN={'遺':'臨床遺伝専門医','カ':'認定遺伝カウンセラー','細':'臨床細胞遺伝学認定士','産':'日本産科婦人科学会 領域講習'};
  const KIND={'シンポジウム':'sym','招待講演':'inv','教育講演':'edu','教育セッション':'edu','一般口演':'ora','ランチョンセミナー':'lun','ポスター発表':'pos','受賞・大会賞':'awd','その他企画':'oth'};
  function cellBody(o,terms){
    const t0=o.talks[0];
    const single=o.s.kind!=='シンポジウム'&&o.talks.length===1;
    const tt0=t0.ja||t0.title;const title=o.s.sponsor?(o.s.session.replace(/^(ランチョンセミナー\d+|スイーツセミナー)：/,'')+'（'+o.s.sponsor+'）'):single?(o.s.kind==='ランチョンセミナー'?t0.affil.replace(/^共催：/,''):tt0.startsWith('（')?o.s.session:(o.s.kind==='一般口演'?tt0+(t0.ja?'':''):tt0)):(o.s.kind==='ポスター発表'?'ポスター発表（討論）':(document.body.classList.contains('mini')&&SJA[o.s.code.split('-')[0]])||o.s.session.replace(/^S\d+\s*/,''));

  }
  function render(){
    const keep={};out.querySelectorAll('.scroll').forEach(e=>{keep[e.dataset.d]=e.scrollLeft});
    const terms=q.value.trim().split(/\s+/).filter(Boolean);
